<!-- The card image (npm run thumbs): on the left a solid of Wythoff's construction, the
     rhombicosidodecahedron of the group [5,3], in outline with its far edges dashed and its faces
     lightly coloured by the part of the dodecahedron they come from (faces, vertices, edges); on
     the right the triheptagonal tiling r{7,3} of the hyperbolic plane in the Poincaré disc, coloured
     the same way. Both computed with the page's polytopes.js and drawn as the page draws them
     (Colours on), with heavier marks. -->
<script src="polytopes.js"></script>
<script>
(function () {
  const P = window.Polytopes, W = MMThumb.W, H = MMThumb.H, TAU = 2 * Math.PI;
  const ctx = MMThumb.canvas();
  const mv = (A, v) => A.map((r) => r.reduce((s, x, k) => s + x * v[k], 0));
  const mm = (A, B) => A.map((r) => B[0].map((_, j) => r.reduce((s, x, k) => s + x * B[k][j], 0)));
  const rotX = (a) => [[1, 0, 0], [0, Math.cos(a), -Math.sin(a)], [0, Math.sin(a), Math.cos(a)]];
  const rotY = (a) => [[Math.cos(a), 0, Math.sin(a)], [0, 1, 0], [-Math.sin(a), 0, Math.cos(a)]];
  const FILL = ['face-2-fill', 'face-3-fill', 'face-1-fill'];

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.lineJoin = ctx.lineCap = 'round';
    // the solid, in perspective as the page draws it: far edges dashed, near faces filled, near edges
    const M = P.model([5, 3]), T = P.chambers(M), Wy = P.wythoff(T, P.uniform(M, [1, 0, 1])), faces = P.planes(Wy);
    const R = mm(rotX(0.36), rotY(-0.42)), FOV = 30 * Math.PI / 180, D = 1 / Math.sin(FOV / 2) * 1.12, f = 1 / Math.tan(FOV / 2);
    const cx = 310, cy = H / 2, s = 268;
    const at = (p) => { const q = mv(R, p), d = D - q[2]; return [cx + f * q[0] / d * s, cy - f * q[1] / d * s]; };
    const eye = mv(R[0].map((_, j) => R.map((r) => r[j])), [0, 0, D]);
    const front = faces.map((fc) => fc.n.reduce((t, x, i) => t + x * (eye[i] - fc.c[i]), 0) > 0);
    const edges = new Map();
    faces.forEach((fc, fi) => fc.v.forEach((a, i) => { const b = fc.v[(i + 1) % fc.v.length], k = Math.min(a, b) + ',' + Math.max(a, b); const e = edges.get(k) || { a: fc.pts[i], b: fc.pts[(i + 1) % fc.pts.length], f: [] }; e.f.push(fi); edges.set(k, e); }));
    const stroke = (list, dash, color, width) => { ctx.setLineDash(dash); ctx.strokeStyle = color; ctx.lineWidth = width; ctx.beginPath(); for (const e of list) { const a = at(e.a), b = at(e.b); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); } ctx.stroke(); ctx.setLineDash([]); };
    const all = [...edges.values()];
    stroke(all.filter((e) => !e.f.some((fi) => front[fi])), [8, 8], MM.rgba('edge', 0.42), 2.2);
    ctx.globalAlpha = 0.78;
    faces.forEach((fc, fi) => {
      if (!front[fi]) return;
      ctx.beginPath();
      fc.pts.forEach((p, i) => { const q = at(p); if (i) ctx.lineTo(q[0], q[1]); else ctx.moveTo(q[0], q[1]); });
      ctx.closePath();
      ctx.fillStyle = MM.color(FILL[fc.k]);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    stroke(all.filter((e) => e.f.some((fi) => front[fi])), [], MM.color('edge'), 4);

    // the triheptagonal tiling in the disc: its faces over a ground of their mean colour (as the page
    // draws it: the faces too small to draw show it near the rim), the edges thinner towards the rim
    const Mh = P.model([7, 3]), Th = P.chambers(Mh, 6), Wh = P.wythoff(Th, P.uniform(Mh, [0, 1, 0]));
    const ox = 890, oy = H / 2, K = 262;
    const disc = (v) => { const q = Math.sqrt(Math.max(0, v[2] * v[2] - v[0] * v[0] - v[1] * v[1])), k = 1 / (v[2] + q); return [ox + K * v[0] * k, oy - K * v[1] * k]; };
    const vtx = (v) => [Wh.pos[3 * v], Wh.pos[3 * v + 1], Wh.pos[3 * v + 2]];
    const geo = (A, B) => {
      const c = [A[1] * B[2] - A[2] * B[1], A[2] * B[0] - A[0] * B[2], A[0] * B[1] - A[1] * B[0]], m = [c[0], c[1], -c[2]], l = Math.hypot(m[0], m[1]);
      if (Math.abs(m[2]) < 1e-9 * l) return null;
      const k = l / Math.abs(m[2]);
      return { x: ox + K * m[0] / m[2], y: oy - K * m[1] / m[2], r: K * Math.sqrt(Math.max(0, k * k - 1)) };
    };
    const edgeTo = (path, a, b) => {
      const p = disc(vtx(a)), q = disc(vtx(b)), g = geo(vtx(a), vtx(b));
      if (!g || g.r > 40 * K || Math.hypot(q[0] - p[0], q[1] - p[1]) < 2) { path.lineTo(q[0], q[1]); return; }
      const a0 = Math.atan2(p[1] - g.y, p[0] - g.x);
      let d = Math.atan2(q[1] - g.y, q[0] - g.x) - a0;
      d -= TAU * Math.round(d / TAU);
      path.arc(g.x, g.y, g.r, a0, a0 + d, d < 0);
    };
    ctx.save();
    ctx.beginPath(); ctx.arc(ox, oy, K, 0, TAU); ctx.clip();
    // the mean colour: each kind of face by its share of the faces' area near the middle
    const area = (pts) => { let a = 0; pts.forEach((p, i) => { const q = pts[(i + 1) % pts.length]; a += p[0] * q[1] - q[0] * p[1]; }); return Math.abs(a) / 2; };
    const share = [0, 0, 0];
    for (const fc of Wh.faces) {
      const pts = fc.v.map((v) => disc(vtx(v))), c = pts.reduce((t, p) => [t[0] + p[0] / pts.length, t[1] + p[1] / pts.length], [0, 0]), r = Math.hypot(c[0] - ox, c[1] - oy) / K;
      if (r < 0.6) share[fc.k] += area(pts) / (1 - r * r) ** 2;
    }
    const rgb = [0, 0, 0], tot = share.reduce((a, b) => a + b, 0);
    share.forEach((a, k) => { if (a) MM.color(FILL[k]).match(/[\d.]+/g).slice(0, 3).forEach((v, i) => { rgb[i] += a * v / tot; }); });
    ctx.fillStyle = 'rgb(' + rgb.map(Math.round).join(',') + ')';
    ctx.fillRect(ox - K, oy - K, 2 * K, 2 * K);
    const fills = [new Path2D(), new Path2D(), new Path2D()];
    for (const fc of Wh.faces) {
      const p0 = disc(vtx(fc.v[0]));
      fills[fc.k].moveTo(p0[0], p0[1]);
      fc.v.forEach((v, i) => edgeTo(fills[fc.k], v, fc.v[(i + 1) % fc.v.length]));
    }
    fills.forEach((path, k) => { ctx.fillStyle = MM.color(FILL[k]); ctx.fill(path); });
    const bands = [new Path2D(), new Path2D(), new Path2D(), new Path2D()];
    for (let i = 0; i < Wh.edges.length; i += 3) {
      const a = Wh.edges[i], b = Wh.edges[i + 1], p = disc(vtx(a)), q = disc(vtx(b));
      if (Math.hypot(q[0] - p[0], q[1] - p[1]) < 1.2) continue;
      const mx = ((p[0] + q[0]) / 2 - ox) / K, my = ((p[1] + q[1]) / 2 - oy) / K, room = 1 - mx * mx - my * my;
      const k = room > 0.5 ? 0 : room > 0.25 ? 1 : room > 0.1 ? 2 : 3;
      bands[k].moveTo(p[0], p[1]);
      edgeTo(bands[k], a, b);
    }
    bands.forEach((path, k) => { ctx.strokeStyle = MM.rgba('edge', [1, 0.9, 0.75, 0.6][k]); ctx.lineWidth = [3.6, 2.6, 1.7, 1][k]; ctx.stroke(path); });
    ctx.restore();
    ctx.strokeStyle = MM.color('ink-3');
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 8]);
    ctx.beginPath(); ctx.arc(ox, oy, K, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
  }
  MM.onFonts(draw);
})();
</script>
