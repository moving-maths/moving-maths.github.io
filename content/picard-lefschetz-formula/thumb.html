<!-- The card image (npm run thumbs): the page's two pictures as it opens (μ = 3, n = 3), computed
     with lefschetz.js as main.js computes them, with heavier marks so that they read at card size.
     Left, the plane of x, coloured by the phase of p(x) − z, with the roots of p(x) = z, the
     vanishing spheres over the arcs of the straight paths (their outlines, a few of their circles
     and their orientations) and the critical points. Right, the plane of values: the Stokes rays,
     the straight paths from z to the critical values, the critical values and the handle z. -->
<script src="lefschetz.js"></script>
<script>
(function () {
  const W = MMThumb.W, H = MMThumb.H, cx = MMThumb.canvas(), PL = window.Lefschetz, TAU = 2 * Math.PI;
  const crit = [[-0.918, -0.239], [0.1, -0.241], [0.818, 0.48]];
  const P = PL.poly(crit), dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  // the page's windows (main.js, fit): the plane of values round the critical values and z, the
  // plane of x round the roots of p(x) = w for w in it
  let Rc = 1e-3;
  P.vals.forEach((v) => { Rc = Math.max(Rc, Math.hypot(v[0], v[1])); });
  const z = [0, -1.25 * Rc], zv = { cx: 0, cy: -0.15 * Rc, R: Math.max(1.6 * Rc, 1.2 * Math.hypot(z[0], z[1] + 0.15 * Rc)) };
  let Rx = 0, guess = null;
  for (let k = 0; k < 96; k++) {
    const t = k / 96 * TAU;
    guess = PL.roots(P, zv.cx + 1.2 * zv.R * Math.cos(t), zv.cy + 1.2 * zv.R * Math.sin(t), guess);
    guess.forEach((q) => { Rx = Math.max(Rx, Math.hypot(q[0], q[1])); });
  }
  crit.forEach((c) => { Rx = Math.max(Rx, 1.15 * Math.hypot(c[0], c[1])); });
  const xv = { cx: 0, cy: 0, R: 1.04 * Rx };
  // the two squares on the card
  const box = (v, x0, y0, side) => {
    const k = side / (2 * v.R);
    return { k, x0, y0, side, X: (x) => x0 + side / 2 + (x - v.cx) * k, Y: (y) => y0 + side / 2 - (y - v.cy) * k, x: (px) => v.cx + (px - x0 - side / 2) / k, y: (py) => v.cy - (py - y0 - side / 2) / k };
  }
  const XB = box(xv, 40, 35, 560), ZB = box(zv, 650, 65, 500);

  // the cycles along the straight paths from z, oriented as on the page
  const rts = PL.roots(P, z[0], z[1]), h = 2 / XB.k;
  const raw = P.vals.map((v, j) => {
    const r = Math.sqrt(dist(z, v)), ph = Math.atan2(z[1] - v[1], z[0] - v[0]);
    const A = PL.lift(P, j, [z[0], z[1], v[0], v[1]], [1, 0], [r * Math.cos(ph / 2), r * Math.sin(ph / 2)], h);
    const kp = A.plus.length - 2, km = A.minus.length - 2;
    return { A, p: PL.nearest(rts, A.plus[kp], A.plus[kp + 1]), q: PL.nearest(rts, A.minus[km], A.minus[km + 1]) };
  });
  const f = PL.niceSigns(raw.map((c) => ({ p: c.p, q: c.q, e: c.A.e })), rts);
  const arcs = raw.map((c, j) => {
    let pts = PL.arcOf(c.A).pts;
    // from the − end to the + end
    if (f.f1[j] < 0) { const o = []; for (let k = pts.length - 2; k >= 0; k -= 2) o.push(pts[k], pts[k + 1]); pts = o; }
    const scr = [], fib = [], e = [0, 0, 0, 0];
    for (let k = 0; k < pts.length; k += 2) {
      scr.push([XB.X(pts[k]), XB.Y(pts[k + 1])]);
      PL.evalPD(P, pts[k], pts[k + 1], e);
      fib.push(Math.sqrt(Math.hypot(z[0] - e[0], z[1] - e[1])));
    }
    return { scr, fib };
  });

  function smooth(Q) {
    cx.beginPath();
    cx.moveTo(Q[0][0], Q[0][1]);
    for (let k = 1; k < Q.length - 1; k++) cx.quadraticCurveTo(Q[k][0], Q[k][1], (Q[k][0] + Q[k + 1][0]) / 2, (Q[k][1] + Q[k + 1][1]) / 2);
    cx.lineTo(Q[Q.length - 1][0], Q[Q.length - 1][1]);
  }
  const offset = (scr, wid, sign) => scr.map((p, k) => {
    const a = scr[Math.max(0, k - 1)], b = scr[Math.min(scr.length - 1, k + 1)], l = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
    return [p[0] - (b[1] - a[1]) / l * wid[k] * sign, p[1] + (b[0] - a[0]) / l * wid[k] * sign];
  });
  function along(scr, d) {
    for (let k = 1; k < scr.length; k++) {
      const l = Math.hypot(scr[k][0] - scr[k - 1][0], scr[k][1] - scr[k - 1][1]);
      if (d <= l) { const t = d / l; return { x: scr[k - 1][0] + t * (scr[k][0] - scr[k - 1][0]), y: scr[k - 1][1] + t * (scr[k][1] - scr[k - 1][1]), dx: (scr[k][0] - scr[k - 1][0]) / l, dy: (scr[k][1] - scr[k - 1][1]) / l, k }; }
      d -= l;
    }
    return null;
  }
  const arcLength = (scr) => { let L = 0; for (let k = 1; k < scr.length; k++) L += Math.hypot(scr[k][0] - scr[k - 1][0], scr[k][1] - scr[k - 1][1]); return L; };

  function draw() {
    cx.clearRect(0, 0, W, H);
    cx.lineCap = 'round'; cx.lineJoin = 'round';
    // the plane of x: the phase of p(x) − z
    const s = 1, w = XB.side * s, hh = XB.side * s, ph = new Float32Array(w * hh), lm = new Float32Array(w * hh), kind = new Uint8Array(w * hh).fill(1);
    for (let py = 0, q = 0; py < hh; py++) {
      const y = XB.y(XB.y0 + (py + 0.5) / s);
      for (let px = 0; px < w; px++, q++) {
        const x = XB.x(XB.x0 + (px + 0.5) / s), e = [0, 0, 0, 0];
        PL.evalPD(P, x, y, e);
        const ar = e[0] - z[0], ai = e[1] - z[1];
        ph[q] = Math.atan2(ai, ar); lm[q] = 0.5 * Math.log(ar * ar + ai * ai + 1e-300);
      }
    }
    const off = document.createElement('canvas'); off.width = w; off.height = hh;
    off.getContext('2d').putImageData(MM.phase.paint(new ImageData(w, hh), { w, h: hh, dpr: s, ph, lm, kind, step: Math.PI / 6, lines: false }), 0, 0);
    cx.save();
    cx.beginPath(); cx.rect(XB.x0, XB.y0, XB.side, XB.side); cx.clip();
    cx.drawImage(off, XB.x0, XB.y0, XB.side, XB.side);
    // the vanishing spheres: outline, axis, a few circles, orientation
    let big = 1e-12;
    arcs.forEach((a) => a.fib.forEach((v) => { big = Math.max(big, v); }));
    const kap = 30 / big;
    arcs.forEach((a, j) => {
      const scr = a.scr, wid = a.fib.map((v) => v * kap), line = MM.color('cy-' + (j + 1) + '-line');
      cx.strokeStyle = line; cx.lineWidth = 4.5;
      smooth(offset(scr, wid, 1)); cx.stroke();
      smooth(offset(scr, wid, -1)); cx.stroke();
      cx.strokeStyle = MM.rgba('cy-' + (j + 1), 0.5); cx.lineWidth = 2.5;
      smooth(scr); cx.stroke();
      const L = arcLength(scr);
      cx.strokeStyle = line; cx.lineWidth = 2.6;
      for (const t of [0.2, 0.4, 0.6, 0.8]) {
        const m = along(scr, t * L);
        if (!m || wid[m.k] < 4) continue;
        cx.beginPath(); cx.ellipse(m.x, m.y, 0.3 * wid[m.k], wid[m.k], Math.atan2(m.dy, m.dx), 0, TAU); cx.stroke();
      }
      const m = along(scr, 0.62 * L);
      if (m) {
        const sz = 12;
        cx.lineWidth = 4.5;
        cx.beginPath();
        cx.moveTo(m.x - m.dx * sz - m.dy * sz * 0.8, m.y - m.dy * sz + m.dx * sz * 0.8);
        cx.lineTo(m.x + m.dx * sz * 0.6, m.y + m.dy * sz * 0.6);
        cx.lineTo(m.x - m.dx * sz + m.dy * sz * 0.8, m.y - m.dy * sz - m.dx * sz * 0.8);
        cx.stroke();
      }
    });
    // the roots of p(x) = z, and the critical points
    cx.fillStyle = MM.color('ink');
    rts.forEach((q) => { cx.beginPath(); cx.arc(XB.X(q[0]), XB.Y(q[1]), 9, 0, TAU); cx.fill(); });
    crit.forEach((c, j) => {
      cx.fillStyle = MM.color('handle'); cx.strokeStyle = MM.color('cy-' + (j + 1) + '-text'); cx.lineWidth = 4.5;
      cx.beginPath(); cx.arc(XB.X(c[0]), XB.Y(c[1]), 15, 0, TAU); cx.fill(); cx.stroke();
    });
    cx.restore();

    // the plane of values: axes, Stokes rays, the paths from z, the critical values, z
    const Z = ZB;
    cx.save();
    cx.beginPath(); cx.rect(Z.x0, Z.y0, Z.side, Z.side); cx.clip();
    cx.strokeStyle = MM.rgba('ink', 0.3); cx.lineWidth = 2;
    cx.beginPath();
    cx.moveTo(Z.x0, Z.Y(0)); cx.lineTo(Z.x0 + Z.side, Z.Y(0));
    cx.moveTo(Z.X(0), Z.y0); cx.lineTo(Z.X(0), Z.y0 + Z.side);
    cx.stroke();
    const vals = P.vals, far = 4 * zv.R;
    cx.strokeStyle = MM.rgba('red', 0.5); cx.lineWidth = 2.8;
    vals.forEach((zj, j) => vals.forEach((zk, k) => {
      if (j === k) return;
      const L = dist(zk, zj);
      cx.beginPath(); cx.moveTo(Z.X(zk[0]), Z.Y(zk[1])); cx.lineTo(Z.X(zk[0] + (zk[0] - zj[0]) / L * far), Z.Y(zk[1] + (zk[1] - zj[1]) / L * far)); cx.stroke();
    }));
    vals.forEach((v, j) => {
      cx.strokeStyle = MM.color('cy-' + (j + 1) + '-line'); cx.lineWidth = 5;
      cx.beginPath(); cx.moveTo(Z.X(z[0]), Z.Y(z[1])); cx.lineTo(Z.X(v[0]), Z.Y(v[1])); cx.stroke();
    });
    vals.forEach((v, j) => { cx.fillStyle = MM.color('cy-' + (j + 1)); cx.beginPath(); cx.arc(Z.X(v[0]), Z.Y(v[1]), 12, 0, TAU); cx.fill(); });
    const hx = Z.X(z[0]), hy = Z.Y(z[1]);
    cx.fillStyle = MM.color('surface'); cx.beginPath(); cx.arc(hx, hy, 24, 0, TAU); cx.fill();
    cx.strokeStyle = MM.color('handle-ring'); cx.lineWidth = 4.5; cx.beginPath(); cx.arc(hx, hy, 24, 0, TAU); cx.stroke();
    cx.fillStyle = MM.color('handle'); cx.beginPath(); cx.arc(hx, hy, 16, 0, TAU); cx.fill();
    cx.restore();
  }
  MM.onFonts(draw);
})();
</script>
