<!-- The card image (npm run thumbs): the main picture, the plane of x, for d = 3 and n = 3 with the
     value a where the page opens, computed with lefschetz.js as main.js computes it, with heavier
     marks so that it reads at card size, across the whole card: shaded by |p(x) − a| with its level
     lines, the roots of p(x) = a, the vanishing spheres over the arcs of the straight paths (their
     outlines, a few of their circles and their orientations) and the critical points. (In the
     script, z is the value a, as in main.js.) -->
<script src="lefschetz.js"></script>
<script>
(function () {
  const W = MMThumb.W, H = MMThumb.H, cx = MMThumb.canvas(), PL = window.Lefschetz, TAU = 2 * Math.PI;
  const crit = [[-0.918, -0.239], [0.1, -0.241], [0.818, 0.48]];
  const P = PL.poly(crit), dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  // the value where the page opens (main.js)
  let Rc = 1e-3;
  P.vals.forEach((v) => { Rc = Math.max(Rc, Math.hypot(v[0], v[1])); });
  const z = [0, -1.25 * Rc];
  // the whole card, round the roots of p(x) = z and the critical points, with room for the spheres
  const rts = PL.roots(P, z[0], z[1]), pts = rts.concat(crit);
  const bx0 = Math.min(...pts.map((q) => q[0])), bx1 = Math.max(...pts.map((q) => q[0])), by0 = Math.min(...pts.map((q) => q[1])), by1 = Math.max(...pts.map((q) => q[1]));
  const kx = Math.min((W - 2 * 110) / (bx1 - bx0), (H - 2 * 75) / (by1 - by0)), mx = (bx0 + bx1) / 2, my = (by0 + by1) / 2;
  const XB = { k: kx, x0: 0, y0: 0, w: W, h: H, X: (x) => W / 2 + (x - mx) * kx, Y: (y) => H / 2 - (y - my) * kx, x: (px) => mx + (px - W / 2) / kx, y: (py) => my - (py - H / 2) / kx };

  // the cycles along the straight paths from z, oriented as on the page
  const h = 2 / XB.k;
  const raw = P.vals.map((v, j) => {
    const r = Math.sqrt(dist(z, v)), ph = Math.atan2(z[1] - v[1], z[0] - v[0]);
    const A = PL.lift(P, j, [z[0], z[1], v[0], v[1]], [1, 0], [r * Math.cos(ph / 2), r * Math.sin(ph / 2)], h);
    const kp = A.plus.length - 2, km = A.minus.length - 2;
    return { A, p: PL.nearest(rts, A.plus[kp], A.plus[kp + 1]), q: PL.nearest(rts, A.minus[km], A.minus[km + 1]) };
  });
  const f = PL.niceSigns(raw.map((c) => ({ p: c.p, q: c.q, e: c.A.e })), rts);
  const arcs = raw.map((c, j) => {
    let pts = PL.arcOf(c.A).pts;
    // from the − end to the + end
    if (f.f1[j] < 0) { const o = []; for (let k = pts.length - 2; k >= 0; k -= 2) o.push(pts[k], pts[k + 1]); pts = o; }
    const scr = [], fib = [], e = [0, 0, 0, 0];
    for (let k = 0; k < pts.length; k += 2) {
      scr.push([XB.X(pts[k]), XB.Y(pts[k + 1])]);
      PL.evalPD(P, pts[k], pts[k + 1], e);
      fib.push(Math.sqrt(Math.hypot(z[0] - e[0], z[1] - e[1])));
    }
    return { scr, fib };
  });

  function smooth(Q) {
    cx.beginPath();
    cx.moveTo(Q[0][0], Q[0][1]);
    for (let k = 1; k < Q.length - 1; k++) cx.quadraticCurveTo(Q[k][0], Q[k][1], (Q[k][0] + Q[k + 1][0]) / 2, (Q[k][1] + Q[k + 1][1]) / 2);
    cx.lineTo(Q[Q.length - 1][0], Q[Q.length - 1][1]);
  }
  const offset = (scr, wid, sign) => scr.map((p, k) => {
    const a = scr[Math.max(0, k - 1)], b = scr[Math.min(scr.length - 1, k + 1)], l = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
    return [p[0] - (b[1] - a[1]) / l * wid[k] * sign, p[1] + (b[0] - a[0]) / l * wid[k] * sign];
  });
  function along(scr, d) {
    for (let k = 1; k < scr.length; k++) {
      const l = Math.hypot(scr[k][0] - scr[k - 1][0], scr[k][1] - scr[k - 1][1]);
      if (d <= l) { const t = d / l; return { x: scr[k - 1][0] + t * (scr[k][0] - scr[k - 1][0]), y: scr[k - 1][1] + t * (scr[k][1] - scr[k - 1][1]), dx: (scr[k][0] - scr[k - 1][0]) / l, dy: (scr[k][1] - scr[k - 1][1]) / l, k }; }
      d -= l;
    }
    return null;
  }
  const arcLength = (scr) => { let L = 0; for (let k = 1; k < scr.length; k++) L += Math.hypot(scr[k][0] - scr[k - 1][0], scr[k][1] - scr[k - 1][1]); return L; };

  function draw() {
    cx.clearRect(0, 0, W, H);
    cx.lineCap = 'round'; cx.lineJoin = 'round';
    // the plane of x: the landscape of g = asinh(|p(x) − z|/σ), light blue below the levels of the
    // critical points, with its level lines, those through the critical points darker (main.js,
    // landImage)
    cx.save();
    cx.beginPath(); cx.rect(XB.x0, XB.y0, XB.w, XB.h); cx.clip();
    const sig = 0.4 * Rc, G0 = 5, nx = Math.ceil(XB.w / G0) + 1, ny = Math.ceil(XB.h / G0) + 1, G = new Float64Array(nx * ny), e = [0, 0, 0, 0];
    const g = (x, y) => { PL.evalPD(P, x, y, e); return Math.asinh(Math.hypot(e[0] - z[0], e[1] - z[1]) / sig); };
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) G[j * nx + i] = g(XB.x(XB.x0 + i * G0), XB.y(XB.y0 + j * G0));
    const lv = P.vals.map((v) => Math.asinh(dist(v, z) / sig)).sort((a, b) => a - b), mid = lv[lv.length >> 1];
    const rgbOf = (name) => MM.color(name).match(/[\d.]+/g).slice(0, 3).map(Number), S = rgbOf('surface'), B = rgbOf('land');
    const off = document.createElement('canvas'); off.width = nx; off.height = ny;
    const octx = off.getContext('2d'), img = octx.createImageData(nx, ny);
    for (let q = 0; q < nx * ny; q++) {
      const a = 0.12 * (1 - Math.tanh((G[q] - mid) / 0.9)), o = 4 * q;
      for (let c = 0; c < 3; c++) img.data[o + c] = S[c] + (B[c] - S[c]) * a;
      img.data[o + 3] = 255;
    }
    octx.putImageData(img, 0, 0);
    cx.imageSmoothingEnabled = true;
    cx.drawImage(off, 0, 0, nx, ny, XB.x0 - G0 / 2, XB.y0 - G0 / 2, nx * G0, ny * G0);
    const segs = (L) => {
      cx.beginPath();
      for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {
        const A = G[j * nx + i] - L, Bv = G[j * nx + i + 1] - L, C = G[(j + 1) * nx + i + 1] - L, D = G[(j + 1) * nx + i] - L, x0 = XB.x0 + i * G0, y0 = XB.y0 + j * G0, q = [];
        if ((A > 0) !== (Bv > 0)) q.push([x0 + G0 * A / (A - Bv), y0]);
        if ((Bv > 0) !== (C > 0)) q.push([x0 + G0, y0 + G0 * Bv / (Bv - C)]);
        if ((D > 0) !== (C > 0)) q.push([x0 + G0 * D / (D - C), y0 + G0]);
        if ((A > 0) !== (D > 0)) q.push([x0, y0 + G0 * A / (A - D)]);
        for (let k = 0; k + 1 < q.length; k += 2) { cx.moveTo(q[k][0], q[k][1]); cx.lineTo(q[k + 1][0], q[k + 1][1]); }
      }
      cx.stroke();
    };
    cx.lineWidth = 2;
    cx.strokeStyle = MM.rgba('c1-text', 0.16);
    for (let k = 1; k * 0.5 < Math.max(...G); k++) segs(k * 0.5);
    cx.strokeStyle = MM.rgba('c1-text', 0.42);
    lv.forEach((L) => segs(L));
    // the vanishing spheres: outline, axis, a few circles, orientation
    let big = 1e-12;
    arcs.forEach((a) => a.fib.forEach((v) => { big = Math.max(big, v); }));
    const kap = 30 / big;
    arcs.forEach((a, j) => {
      const scr = a.scr, wid = a.fib.map((v) => v * kap), line = MM.color('cy-' + (j + 1) + '-line');
      cx.strokeStyle = line; cx.lineWidth = 4.5;
      smooth(offset(scr, wid, 1)); cx.stroke();
      smooth(offset(scr, wid, -1)); cx.stroke();
      cx.strokeStyle = MM.rgba('cy-' + (j + 1), 0.5); cx.lineWidth = 2.5;
      smooth(scr); cx.stroke();
      const L = arcLength(scr);
      cx.strokeStyle = line; cx.lineWidth = 2.6;
      for (const t of [0.2, 0.4, 0.6, 0.8]) {
        const m = along(scr, t * L);
        if (!m || wid[m.k] < 4) continue;
        cx.beginPath(); cx.ellipse(m.x, m.y, 0.3 * wid[m.k], wid[m.k], Math.atan2(m.dy, m.dx), 0, TAU); cx.stroke();
      }
      const m = along(scr, 0.62 * L);
      if (m) {
        const sz = 12;
        cx.lineWidth = 4.5;
        cx.beginPath();
        cx.moveTo(m.x - m.dx * sz - m.dy * sz * 0.8, m.y - m.dy * sz + m.dx * sz * 0.8);
        cx.lineTo(m.x + m.dx * sz * 0.6, m.y + m.dy * sz * 0.6);
        cx.lineTo(m.x - m.dx * sz + m.dy * sz * 0.8, m.y - m.dy * sz - m.dx * sz * 0.8);
        cx.stroke();
      }
    });
    // the roots of p(x) = z, and the critical points
    cx.fillStyle = MM.color('ink');
    rts.forEach((q) => { cx.beginPath(); cx.arc(XB.X(q[0]), XB.Y(q[1]), 9, 0, TAU); cx.fill(); });
    crit.forEach((c, j) => {
      cx.fillStyle = MM.color('handle'); cx.strokeStyle = MM.color('cy-' + (j + 1) + '-text'); cx.lineWidth = 4.5;
      cx.beginPath(); cx.arc(XB.X(c[0]), XB.Y(c[1]), 15, 0, TAU); cx.fill(); cx.stroke();
    });
    cx.restore();
  }
  MM.onFonts(draw);
})();
</script>
